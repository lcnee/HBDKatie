<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Katie Photobooth</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#111; font-family:'Segoe UI', sans-serif; user-select:none; }

  #stage { position:relative; width:100vw; height:100vh; background:#111; overflow:hidden; }
  video { display:none; }
  canvas#main { position:absolute; top:0; left:0; width:100%; height:100%; }

  /* ---------- top bar ---------- */
  #topbar {
    position:absolute; top:0; left:0; width:100%; z-index:20;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px;
    padding:10px 10px 8px;
    background:linear-gradient(to bottom, rgba(255,255,255,0.85), rgba(255,255,255,0));
  }
  .pill {
    padding:7px 14px; border-radius:20px; border:none;
    background:rgba(255,255,255,0.12); color:#fff; font-size:12.5px; font-weight:700;
    cursor:pointer; transition:.15s;
  }
  .pill.active { background:#fff; color:#111; }
  .pill.small { padding:6px 10px; font-size:11.5px; }

  #status {
    position:absolute; top:56px; left:50%; transform:translateX(-50%);
    color:#111; font-size:12px; font-weight:600;
    padding:5px 12px; background:#ffffffcc; border-radius:16px; z-index:20;
  }

  #countdown {
    position:absolute; inset:0; z-index:25; display:none;
    align-items:center; justify-content:center;
    font-size:120px; font-weight:800; color:#fff;
    text-shadow:0 0 30px rgba(255,255,255,0.6); font-family:'Segoe UI';
  }

  /* ---------- bottom bar ---------- */
  #bottombar {
    position:absolute; bottom:0; left:0; width:100%; z-index:20;
    display:flex; align-items:center; justify-content:center; gap:26px;
    padding:16px 0 28px;
    background:linear-gradient(to top, rgba(255,255,255,0.9), rgba(255,255,255,0));
  }
  .round-btn {
    width:58px; height:58px; border-radius:50%; border:none;
    background:rgba(255,255,255,0.12); display:flex; align-items:center; justify-content:center;
    font-size:22px; cursor:pointer; color:#fff;
  }
  #shutter {
    width:78px; height:78px; border-radius:50%; border:5px solid #ffffff;
    background:#fff;
    cursor:pointer; transition:transform .1s;
  }
  #shutter:active { transform:scale(0.88); }
  #recBtn.recording { background:#ff3b30; color:#fff; animation:pulse 1s infinite; }
  @keyframes pulse { 0%{opacity:1;} 50%{opacity:.5;} 100%{opacity:1;} }

  /* ---------- preview overlay ---------- */
  #preview {
    position:fixed; inset:0; background:#111; z-index:60;
    display:none; align-items:center; justify-content:center; flex-direction:column; padding:20px;
  }
  #preview img, #preview video { max-width:92%; max-height:74%; border-radius:14px; box-shadow:0 6px 22px rgba(0,0,0,0.4); }
  #preview .row { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; justify-content:center; }
  #preview button {
    padding:11px 20px; border-radius:26px; border:none; font-size:14px; font-weight:700; cursor:pointer;
  }
  .btn-ghost { background:rgba(255,255,255,0.15); color:#fff; }
  .btn-solid { background:#fff; color:#111; }
  #gifProgress { color:#fff; font-size:13px; margin-top:10px; font-weight:600; }

  /* ---------- gallery (right column of captured shots) ---------- */
  #gallery {
    position:absolute; top:96px; bottom:104px; right:6px; width:78px; z-index:22;
    display:flex; flex-direction:column; gap:8px; overflow-y:auto; overflow-x:hidden;
    padding:2px; -webkit-overflow-scrolling:touch;
  }
  #gallery::-webkit-scrollbar{ width:4px; }
  .gshot {
    position:relative; width:72px; height:96px; border-radius:8px; overflow:hidden;
    border:2px solid rgba(255,255,255,0.5); box-shadow:0 3px 10px rgba(0,0,0,0.35);
    cursor:pointer; flex-shrink:0; background:#000;
  }
  .gshot img { width:100%; height:100%; object-fit:cover; display:block; }
  .gshot.selected { border-color:#fff; box-shadow:0 0 0 3px #ff6f9c, 0 3px 10px rgba(0,0,0,0.35); }
  .gshot .gcheck {
    position:absolute; top:4px; left:4px; width:16px; height:16px; border-radius:50%;
    border:2px solid #fff; background:rgba(0,0,0,0.25);
  }
  .gshot.selected .gcheck { background:#ff6f9c; }
  .gshot .gdel {
    position:absolute; top:2px; right:2px; width:18px; height:18px; border-radius:50%;
    background:rgba(0,0,0,0.55); color:#fff; font-size:12px; line-height:18px; text-align:center;
    font-weight:700;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="main"></canvas>

  <div id="topbar">
    <span class="pill small active" id="filterNormal">Normal</span>
    <span class="pill small" id="filterBW">B&W</span>
    <span class="pill small" id="filterSoft">Smooth ✨</span>
    <span class="pill small active" id="crosswordToggle">Crossword: On</span>
  </div>

  <div id="status">Opening camera...</div>
  <div id="countdown">3</div>

  <div id="gallery"></div>

  <div id="bottombar">
    <div class="round-btn" id="recBtn">⏺</div>
    <div id="shutter"></div>
    <div class="round-btn" id="gifBtn">🎞️</div>
  </div>
</div>

<div id="preview">
  <img id="previewImg" style="display:none;">
  <video id="previewVid" controls style="display:none;"></video>
  <div id="gifProgress" style="display:none;"></div>
  <div class="row">
    <button class="btn-ghost" id="closeBtn">Close</button>
    <button class="btn-ghost" id="retakeBtn">Retake</button>
    <button class="btn-solid" id="saveBtn">Download</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
<script>
const video = document.getElementById('video');
const canvas = document.getElementById('main');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const countdownEl = document.getElementById('countdown');

function resize() { canvas.width = innerWidth; canvas.height = innerHeight; }
resize();
window.addEventListener('resize', resize);

// ============ state ============
let currentFilter = 'normal'; // normal | bw | soft
let isRecording = false;
let crosswordOn = true; // always on now; squares only change when tapping the screen
let capturedFrames = []; // dataURLs from burst, used for GIF / strip
let videoTransform = { scale:1, offsetX:0, offsetY:0, vw:0, vh:0 };
let latestHandLandmarks = [];

// ============ word/finger config ============
const WORDS = ["happy", "birthday", "katie", "!", "so", "much"];
const FINGER_COLORS = ["#ff5f7e", "#ffd166", "#8be3d0", "#c39bff", "#ff8fd1"];
const FINGER_TIPS = [4, 8, 12, 16, 20];
const FINGER_PIP  = [3, 6, 10, 14, 18];
const WRIST = 0;

let particles = [];
function spawnBurst(x, y) {
  for (let i = 0; i < 26; i++) {
    const angle = (Math.PI*2*i)/26 + Math.random()*0.5;
    const speed = 3 + Math.random()*6;
    particles.push({ x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-2,
      rot:Math.random()*Math.PI, vrot:(Math.random()-0.5)*0.3,
      size:8+Math.random()*10, life:1,
      color:["#ffd93d","#ff6f9c","#8be3d0","#ffffff","#c39bff"][Math.floor(Math.random()*5)] });
  }
}
function drawStar(x,y,size,rot,color,alpha){
  ctx.save(); ctx.globalAlpha=alpha; ctx.translate(x,y); ctx.rotate(rot); ctx.beginPath();
  for(let i=0;i<5;i++){
    ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*size, -Math.sin((18+i*72)*Math.PI/180)*size);
    ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*size*0.45, -Math.sin((54+i*72)*Math.PI/180)*size*0.45);
  }
  ctx.closePath(); ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=10; ctx.fill(); ctx.restore();
}
function updateParticles(){
  particles.forEach(p=>{ p.vy+=0.15; p.vx*=0.985; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vrot; p.life-=0.018; });
  particles = particles.filter(p=>p.life>0);
  particles.forEach(p=>drawStar(p.x,p.y,p.size,p.rot,p.color,Math.max(p.life,0)));
}

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function isHandOpen(lm){
  let ext=0;
  for(let i=0;i<FINGER_TIPS.length;i++){
    if(dist(lm[WRIST], lm[FINGER_TIPS[i]]) > dist(lm[WRIST], lm[FINGER_PIP[i]])*1.15) ext++;
  }
  return ext>=4;
}

// map a normalized landmark (0..1, mirrored-space) to actual canvas pixel coords,
// accounting for the same cover-crop transform used to draw the video.
function landmarkToCanvas(nx, ny){
  const t = videoTransform;
  // nx,ny are in "mirrored" video coordinate (0=left visually). Video drawn unmirrored
  // internally then CSS-mirrored is NOT used here (we draw manually), so unmirror x first:
  const ux = 1 - nx;
  const px = ux * t.vw * t.scale + t.offsetX;
  const py = ny * t.vh * t.scale + t.offsetY;
  return { x: px, y: py };
}

const pinchState = [{isPinching:false},{isPinching:false}];

// Compute the same cover-crop video transform as renderLoop, but for an arbitrary
// target width/height (used to bake the finger-word overlay into captured photos too).
function computeVideoTransform(width, height){
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(width/vw, height/vh);
  const dw = vw*scale, dh = vh*scale;
  const offsetX = (width-dw)/2, offsetY = (height-dh)/2;
  return { scale, offsetX, offsetY, vw, vh };
}
function landmarkToPoint(nx, ny, t){
  const ux = 1 - nx;
  const px = ux * t.vw * t.scale + t.offsetX;
  const py = ny * t.vh * t.scale + t.offsetY;
  return { x: px, y: py };
}

// Draws the finger-tracked words onto any target canvas context at any resolution.
// Used both for the live preview (canvas.width/height) and for baking into captures
// (CAPTURE_W/CAPTURE_H), so the words actually show up in the saved photo.
function drawHandOverlayOn(targetCtx, width, height){
  const transform = computeVideoTransform(width, height);
  const scaleF = width / canvas.width; // scale dot/font size to match target resolution
  let wordCursor = 0;
  latestHandLandmarks.forEach((lm)=>{
    const open = isHandOpen(lm);
    if(!open) return;
    FINGER_TIPS.forEach((tipIdx,i)=>{
      const p = landmarkToPoint(lm[tipIdx].x, lm[tipIdx].y, transform);
      const color = FINGER_COLORS[i % FINGER_COLORS.length];
      const word = WORDS[wordCursor % WORDS.length]; wordCursor++;

      targetCtx.beginPath(); targetCtx.arc(p.x,p.y,7*scaleF,0,Math.PI*2);
      targetCtx.fillStyle=color; targetCtx.shadowColor=color; targetCtx.shadowBlur=8*scaleF; targetCtx.fill(); targetCtx.shadowBlur=0;

      targetCtx.save();
      targetCtx.font=`bold ${Math.round(22*scaleF)}px 'Segoe UI', sans-serif`; targetCtx.textAlign="center";
      targetCtx.fillStyle="#000"; targetCtx.globalAlpha=0.3;
      targetCtx.fillText(word, p.x+1*scaleF, p.y-33*scaleF);
      targetCtx.globalAlpha=1; targetCtx.fillStyle=color;
      targetCtx.fillText(word, p.x, p.y-34*scaleF);
      targetCtx.restore();
    });
  });
}

function drawHandOverlay(){
  latestHandLandmarks.forEach((lm, handIdx)=>{
    const thumb = lm[4], index = lm[8];
    const thumbPx = landmarkToCanvas(thumb.x, thumb.y);
    const indexPx = landmarkToCanvas(index.x, index.y);
    const pinchDistPx = dist(thumbPx, indexPx);
    const state = pinchState[handIdx] || (pinchState[handIdx]={isPinching:false});

    if(pinchDistPx < 34){ state.isPinching = true; }
    else if(pinchDistPx > 85 && state.isPinching){
      spawnBurst((thumbPx.x+indexPx.x)/2, (thumbPx.y+indexPx.y)/2);
      state.isPinching = false;
    }
  });
  drawHandOverlayOn(ctx, canvas.width, canvas.height);
  updateParticles();
}

// ============ crossword overlay (grid + word tiles + pink squares) ============
const CROSSWORD_WORDS = [
  { word:'BIRTHDAE', col:10, row:16, dir:'h' },
  { word:'HAPPI',     col:11, row:12, dir:'v' }, // shares the 'I' with BIRTHDAE
  { word:'KATIE',     col:17, row:12, dir:'v' }, // shares the 'E' with BIRTHDAE
  { word:'CAKE',      col:19, row:12, dir:'h' },
  { word:'LOVE',      col:32, row:26, dir:'h' },
];
let scatterSquares = [];
let lastGridDims = { cellSize:0, cols:0, rows:0 };

function buildScatterGrid(width, height){
  const cellSize = width / 60;
  const cols = Math.ceil(width / cellSize) + 1;
  const rows = Math.ceil(height / cellSize) + 1;
  const squares = [];
  const count = Math.round((cols*rows) / 26);
  // Bottom-left corner is reserved for the decorative frame/cursive text overlay,
  // so keep the random pink squares out of that zone.
  const excludeColMax = cols * 0.4;
  const excludeRowMin = rows * 0.55;
  for(let i=0;i<count;i++){
    let col, row;
    do {
      col = Math.floor(Math.random()*cols);
      row = Math.floor(Math.random()*rows);
    } while (col < excludeColMax && row > excludeRowMin);
    squares.push({ col, row });
  }
  return { cellSize, cols, rows, squares };
}

function rebuildScatterSquares(){
  lastGridDims = buildScatterGrid(canvas.width, canvas.height);
}
window.addEventListener('resize', ()=>{ if(crosswordOn) rebuildScatterSquares(); });

function drawCrosswordOn(targetCtx, width, height, grid){
  const { cellSize, cols, rows, squares } = grid;

  targetCtx.save();
  targetCtx.strokeStyle = 'rgba(255,255,255,0.35)';
  targetCtx.lineWidth = 1;
  for(let c=0;c<=cols;c++){ targetCtx.beginPath(); targetCtx.moveTo(c*cellSize,0); targetCtx.lineTo(c*cellSize,height); targetCtx.stroke(); }
  for(let r=0;r<=rows;r++){ targetCtx.beginPath(); targetCtx.moveTo(0,r*cellSize); targetCtx.lineTo(width,r*cellSize); targetCtx.stroke(); }
  targetCtx.restore();

  targetCtx.save();
  targetCtx.fillStyle = '#ff9ec4';
  targetCtx.globalAlpha = 0.85;
  squares.forEach(s=>{
    targetCtx.fillRect(s.col*cellSize+2, s.row*cellSize+2, cellSize-4, cellSize-4);
  });
  targetCtx.restore();

  CROSSWORD_WORDS.forEach(({word,col,row,dir})=>{
    [...word].forEach((letter,i)=>{
      const c = dir==='h' ? col+i : col;
      const r = dir==='v' ? row+i : row;
      const x = c*cellSize, y = r*cellSize;
      targetCtx.save();
      targetCtx.fillStyle = '#ff9ec4';
      targetCtx.beginPath();
      targetCtx.roundRect ? targetCtx.roundRect(x+2,y+2,cellSize-4,cellSize-4,4) : targetCtx.rect(x+2,y+2,cellSize-4,cellSize-4);
      targetCtx.fill();
      targetCtx.fillStyle = '#fff';
      targetCtx.font = `bold ${Math.round(cellSize*0.5)}px 'Segoe UI', sans-serif`;
      targetCtx.textAlign = 'center'; targetCtx.textBaseline = 'middle';
      targetCtx.fillText(letter, x+cellSize/2, y+cellSize/2+1);
      targetCtx.restore();
    });
  });
}

function drawCrossword(){
  if(!crosswordOn) return;
  if(!lastGridDims.squares || lastGridDims.cellSize !== canvas.width/60) rebuildScatterSquares();
  drawCrosswordOn(ctx, canvas.width, canvas.height, lastGridDims);
}

// ============ video filter buffer ============
// Safari (iPadOS in particular) has a known bug: ctx.filter is silently
// ignored when the drawImage() source is a <video> element directly - the
// button highlights, currentFilter changes, but the pixels never change.
// Filter DOES work when the source is a canvas/image instead. So we draw the
// raw video frame into this small offscreen canvas first (no filter), then
// draw *that* canvas onto the real target with the filter applied.
const videoBuf = document.createElement('canvas');
const videoBufCtx = videoBuf.getContext('2d');
function updateVideoBuf(vw, vh){
  if(videoBuf.width !== vw || videoBuf.height !== vh){ videoBuf.width = vw; videoBuf.height = vh; }
  videoBufCtx.drawImage(video, 0, 0, vw, vh);
}

// ============ main render loop ============
function applyCanvasFilter(){
  if(currentFilter === 'bw') ctx.filter = 'grayscale(1) contrast(1.05) brightness(1.05)';
  else if(currentFilter === 'soft') ctx.filter = 'blur(1.1px) brightness(1.12) contrast(0.92) saturate(1.05)';
  else ctx.filter = 'none';
}

function renderLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(video.readyState >= 2){
    const vw = video.videoWidth, vh = video.videoHeight;
    const scale = Math.max(canvas.width/vw, canvas.height/vh);
    const dw = vw*scale, dh = vh*scale;
    const offsetX = (canvas.width-dw)/2, offsetY=(canvas.height-dh)/2;
    videoTransform = { scale, offsetX, offsetY, vw, vh };

    updateVideoBuf(vw, vh);
    applyCanvasFilter();
    ctx.save();
    ctx.translate(canvas.width, 0); ctx.scale(-1,1); // mirror selfie
    ctx.drawImage(videoBuf, canvas.width-dw-offsetX, offsetY, dw, dh);
    ctx.restore();
    ctx.filter = 'none';

    statusEl.style.display = 'none';
  } else {
    statusEl.style.display = 'block';
    statusEl.textContent = "Opening camera...";
  }
  drawCrossword();
  drawHandOverlay();
  drawFrameOverlayIfRecording();
  requestAnimationFrame(renderLoop);
}
renderLoop();

// ============ top bar interactions ============
// NOTE: these bindings are set up BEFORE the mediapipe hands/camera init below.
// On some devices (iPad Safari in particular) mediapipe can throw or fail to
// load; since this is all one <script> block, an uncaught error there used to
// stop every line after it from ever running - which silently broke the
// filter buttons, the crossword toggle, the shutter button, etc. Binding the
// UI first means those keep working even if hand-tracking fails.
function setActivePill(group, activeId){
  group.forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById(activeId).classList.add('active');
}
['filterNormal','filterBW','filterSoft'].forEach(id=>{
  document.getElementById(id).addEventListener('click', ()=>{
    currentFilter = id==='filterNormal' ? 'normal' : id==='filterBW' ? 'bw' : 'soft';
    setActivePill(['filterNormal','filterBW','filterSoft'], id);
  });
});

// ============ mediapipe hands ============
// Everything in this block is wrapped so a failure here (missing WASM/SIMD
// support, camera constraints not matching what the device offers, etc. -
// all seen on iPad Safari) can't take down the rest of the app. Without
// hand tracking, the finger words and the pinch-burst "falling stars" just
// won't appear (latestHandLandmarks stays empty), but everything else keeps
// working.
try {
  const hands = new Hands({ locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}` });
  hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.65, minTrackingConfidence:0.6 });
  hands.onResults(r=>{ latestHandLandmarks = r.multiHandLandmarks || []; });

  const camera = new Camera(video, {
    onFrame: async ()=>{
      try { await hands.send({image:video}); }
      catch(e){ /* swallow per-frame errors so the camera loop keeps running */ }
    },
    width:640, height:480
  });
  camera.start().catch(err=>{
    console.warn('Hand-tracking camera failed to start:', err);
    statusEl.textContent = "Could not open camera - check permissions";
  });
} catch(err){
  console.warn('Hand-tracking unavailable on this device:', err);
}


// ============ single-shot capture -> composited into decorative frame ============
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// Base photo resolution before scaling into the frame.
const CAPTURE_W = 1920, CAPTURE_H = 1080;
// Frame artwork (see FRAME_IMG below) native size.
const FRAME_W = 1600, FRAME_H = 1035;
// Photo is shrunk to this fraction of its own size, then centered & rotated.

async function singleCapture(){
  capturedFrames = [];
  countdownEl.style.display='flex';
  for(let c=3;c>=1;c--){ countdownEl.textContent=c; await sleep(700); }
  countdownEl.style.display='none';
  // flash
  ctx.save(); ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.restore();
  await new Promise(r=>requestAnimationFrame(r));

  // Grab a clean 1920x1080 capture straight from the video (cover-fit crop),
  // reapplying whatever filter is currently active.
  const shot = document.createElement('canvas');
  shot.width = CAPTURE_W; shot.height = CAPTURE_H;
  const sctx = shot.getContext('2d');
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(CAPTURE_W/vw, CAPTURE_H/vh);
  const dw = vw*scale, dh = vh*scale;
  const offsetX = (CAPTURE_W-dw)/2, offsetY = (CAPTURE_H-dh)/2;
  updateVideoBuf(vw, vh);
  applyCanvasFilterTo(sctx);
  sctx.save();
  sctx.translate(CAPTURE_W, 0); sctx.scale(-1,1); // mirror selfie, matches live preview
  sctx.drawImage(videoBuf, CAPTURE_W-dw-offsetX, offsetY, dw, dh);
  sctx.restore();
  sctx.filter = 'none';

  // Bake the crossword overlay into the capture too, if it's turned on.
  if(crosswordOn){
    const captureGrid = buildScatterGrid(CAPTURE_W, CAPTURE_H);
    drawCrosswordOn(sctx, CAPTURE_W, CAPTURE_H, captureGrid);
  }

  // Bake the finger-tracked words into the capture too, so they show up in the saved photo.
  drawHandOverlayOn(sctx, CAPTURE_W, CAPTURE_H);

  capturedFrames.push(shot.toDataURL('image/jpeg', 0.95));
  composeIntoFrame(shot);
}

// ============ gallery (right-side list of captured shots) ============
let framedFrames = [];       // dataURLs of the framed (final) photos, parallel to capturedFrames
let selectedGallery = new Set(); // indices selected for GIF making
const galleryEl = document.getElementById('gallery');

function addToGallery(dataUrl){
  framedFrames.push(dataUrl);
  const idx = framedFrames.length - 1;

  const wrap = document.createElement('div');
  wrap.className = 'gshot';
  wrap.dataset.idx = idx;

  const img = document.createElement('img');
  img.src = dataUrl;
  wrap.appendChild(img);

  const check = document.createElement('div');
  check.className = 'gcheck';
  wrap.appendChild(check);

  const del = document.createElement('div');
  del.className = 'gdel';
  del.textContent = '✕';
  wrap.appendChild(del);

  // tap the check bubble (or shift/long area) toggles selection for GIF
  check.addEventListener('click', (e)=>{
    e.stopPropagation();
    toggleGallerySelect(wrap, idx);
  });
  // tap the ✕ deletes this shot
  del.addEventListener('click', (e)=>{
    e.stopPropagation();
    removeFromGallery(wrap, idx);
  });
  // tap the photo itself opens it full-size to download
  img.addEventListener('click', ()=>{
    openGalleryPreview(idx);
  });

  galleryEl.appendChild(wrap);
  galleryEl.scrollTop = galleryEl.scrollHeight;
}

function toggleGallerySelect(wrap, idx){
  if(selectedGallery.has(idx)){ selectedGallery.delete(idx); wrap.classList.remove('selected'); }
  else { selectedGallery.add(idx); wrap.classList.add('selected'); }
}

function removeFromGallery(wrap, idx){
  selectedGallery.delete(idx);
  wrap.remove();
  // mark as removed but keep array indices stable (so other idx references stay valid)
  framedFrames[idx] = null;
  capturedFrames[idx] = null;
}

function openGalleryPreview(idx){
  const url = framedFrames[idx];
  if(!url) return;
  currentGalleryIdx = idx;
  openPreview(url, 'jpg');
}
let currentGalleryIdx = null;

function applyCanvasFilterTo(targetCtx){
  if(currentFilter === 'bw') targetCtx.filter = 'grayscale(1) contrast(1.05) brightness(1.05)';
  else if(currentFilter === 'soft') targetCtx.filter = 'blur(1.1px) brightness(1.12) contrast(0.92) saturate(1.05)';
  else targetCtx.filter = 'none';
}

function composeIntoFrame(shotCanvas){
  const finalCanvas = document.createElement('canvas');
  finalCanvas.width = FRAME_W; finalCanvas.height = FRAME_H;
  const fctx = finalCanvas.getContext('2d');

  fctx.fillStyle = '#ffffff';
  fctx.fillRect(0,0,FRAME_W,FRAME_H);

  const photoX = (FRAME_W - PHOTO_OUT_W) / 2;
  const photoY = (FRAME_H - PHOTO_OUT_H) / 2;
  fctx.drawImage(shotCanvas, photoX, photoY, PHOTO_OUT_W, PHOTO_OUT_H);

  function finish(){
    fctx.drawImage(FRAME_IMG, 0, 0, FRAME_W, FRAME_H);
    addToGallery(finalCanvas.toDataURL('image/jpeg', 0.95));
  }
  if(FRAME_IMG.complete) finish();
  else FRAME_IMG.onload = finish;
}

const previewEl = document.getElementById('preview');
const previewImg = document.getElementById('previewImg');
const previewVid = document.getElementById('previewVid');
const gifProgress = document.getElementById('gifProgress');
let currentDownload = null;
let lastCaptureType = null;

function openPreview(dataUrlOrBlobUrl, type){
  lastCaptureType = type;
  previewImg.style.display='none'; previewVid.style.display='none'; gifProgress.style.display='none';
  if(type==='jpg' || type==='gif'){
    previewImg.src = dataUrlOrBlobUrl; previewImg.style.display='block';
    currentDownload = { url:dataUrlOrBlobUrl, name: type==='gif' ? 'katie-photobooth.gif' : 'katie-photobooth.jpg' };
  } else if(type==='webm'){
    previewVid.src = dataUrlOrBlobUrl; previewVid.style.display='block';
    currentDownload = { url:dataUrlOrBlobUrl, name:'katie-photobooth.webm' };
  }
  document.getElementById('retakeBtn').textContent = (type==='jpg' && currentGalleryIdx!==null) ? 'Delete' : 'Retake';
  previewEl.style.display='flex';
}
const retakeBtn = document.getElementById('retakeBtn');
document.getElementById('closeBtn').addEventListener('click', ()=>{ previewEl.style.display='none'; currentGalleryIdx=null; });
retakeBtn.addEventListener('click', ()=>{
  previewEl.style.display='none';
  if(lastCaptureType==='jpg' && currentGalleryIdx!==null){
    // viewing a gallery shot -> "Retake" deletes it from the gallery
    const wrap = galleryEl.querySelector(`.gshot[data-idx="${currentGalleryIdx}"]`);
    if(wrap) removeFromGallery(wrap, currentGalleryIdx);
    currentGalleryIdx = null;
  } else if(lastCaptureType==='webm'){
    document.getElementById('recBtn').click();
  } else if(lastCaptureType==='gif'){
    document.getElementById('gifBtn').click();
  }
});
document.getElementById('saveBtn').addEventListener('click', ()=>{
  if(!currentDownload) return;
  const a = document.createElement('a');
  a.href = currentDownload.url; a.download = currentDownload.name; a.click();
});

// ============ video recording ============
let mediaRecorder = null, recChunks = [];
document.getElementById('recBtn').addEventListener('click', ()=>{
  const btn = document.getElementById('recBtn');
  if(!mediaRecorder || mediaRecorder.state==='inactive'){
    const stream = canvas.captureStream(30);
    recChunks = [];
    try{
      mediaRecorder = new MediaRecorder(stream, { mimeType:'video/webm;codecs=vp9' });
    }catch(e){
      mediaRecorder = new MediaRecorder(stream);
    }
    mediaRecorder.ondataavailable = e=>{ if(e.data.size>0) recChunks.push(e.data); };
    mediaRecorder.onstop = ()=>{
      const blob = new Blob(recChunks, { type:'video/webm' });
      openPreview(URL.createObjectURL(blob), 'webm');
    };
    mediaRecorder.start();
    isRecording = true;
    recordFrameStartTime = performance.now();
    btn.classList.add('recording'); btn.textContent='⏹';
  } else {
    mediaRecorder.stop();
    isRecording = false;
    btn.classList.remove('recording'); btn.textContent='⏺';
  }
});

// Draw the decorative frame over the live canvas while recording, so it
// gets baked into the captured video stream.
let recordFrameStartTime = 0;
const FRAME_FADE_MS = 350; // fade the frame in instead of popping in suddenly
function drawFrameOverlayIfRecording(){
  if(!isRecording || !FRAME_IMG.complete || !FRAME_IMG.naturalWidth) return;
  const fw = FRAME_IMG.naturalWidth, fh = FRAME_IMG.naturalHeight;
  // Use cover-fit (not contain) so the frame fills the canvas edge to edge -
  // contain-fit left empty gaps on the sides whenever the frame's aspect
  // ratio didn't exactly match the canvas's.
  const scale = Math.max(canvas.width/fw, canvas.height/fh);
  const dw = fw*scale, dh = fh*scale;
  const ox = (canvas.width-dw)/2, oy = (canvas.height-dh)/2;
  const elapsed = performance.now() - recordFrameStartTime;
  const alpha = Math.min(1, elapsed / FRAME_FADE_MS);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.drawImage(FRAME_IMG, ox, oy, dw, dh);
  ctx.restore();
}

// ============ combine captured frames into GIF ============
document.getElementById('gifBtn').addEventListener('click', ()=>{
  // use whatever the person selected (checkmark bubble) in the gallery;
  // if nothing is selected, fall back to every remaining shot
  let frameSrcs;
  if(selectedGallery.size > 0){
    frameSrcs = [...selectedGallery].sort((a,b)=>a-b)
      .map(i=> capturedFrames[i]).filter(Boolean);
  } else {
    frameSrcs = capturedFrames.filter(Boolean);
  }

  if(frameSrcs.length < 2){
    statusEl.style.display='block';
    statusEl.textContent = "Take (or select) at least 2 photos before making a GIF";
    setTimeout(()=>{ statusEl.style.display='none'; }, 2500);
    return;
  }
  previewEl.style.display='flex';
  previewImg.style.display='none'; previewVid.style.display='none';
  gifProgress.style.display='block'; gifProgress.textContent = 'Building GIF... 0%';

  const gif = new GIF({
    workers: 2,
    quality: 10,
    workerScript: 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js'
  });

  let loaded = 0;
  const imgs = [];
  frameSrcs.forEach(src=>{
    const img = new Image();
    img.onload = ()=>{
      loaded++;
      if(loaded === frameSrcs.length){
        imgs.forEach(im=> gif.addFrame(im, { delay: 500 }));
        gif.on('progress', p=>{ gifProgress.textContent = `Building GIF... ${Math.round(p*100)}%`; });
        gif.on('finished', blob=>{
          gifProgress.style.display='none';
          currentGalleryIdx = null;
          openPreview(URL.createObjectURL(blob), 'gif');
        });
        gif.render();
      }
    };
    img.src = src;
    imgs.push(img);
  });
});
</script>
</body>
</html>
